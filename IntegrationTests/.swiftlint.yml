included:
  - Tests

excluded:
  - .build
  - DerivedData

disabled_rules:
  - closure_parameter_position
  - identifier_name
  - line_length
  - optional_data_string_conversion
  - todo

opt_in_rules:
  - redundant_sendable

identifier_name:
  min_length: 1
  allowed_symbols:
    - _

nesting:
  type_level: 2

# Length ratchet, mirrored from the root .swiftlint.yml; AGENTS.md carries the authoring rule.
file_length:
  warning: 1000
  ignore_comment_only_lines: true

type_body_length:
  warning: 800
