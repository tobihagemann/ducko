# Exact pin: SwiftLint adds default rules in minor releases, so a floating version can fail lint on
# untouched code. CI installs this exact version; a local mismatch fails lint with a version warning.
swiftlint_version: 0.65.1

included:
  - Sources/DuckoXMPP
  - Sources/DuckoCore
  - Sources/DuckoData
  - Sources/DuckoUI
  - Sources/DuckoApp
  - Sources/DuckoCLI
  - Tests

excluded:
  - .build
  - DerivedData
  - Sources/DuckoXMPP/Stanzas/Normalization/UnicodeTables.generated.swift
  - IntegrationTests

disabled_rules:
  - closure_parameter_position
  - line_length
  - optional_data_string_conversion
  - todo

opt_in_rules:
  - redundant_sendable

cyclomatic_complexity:
  ignores_case_statements: true

# Length ratchet; AGENTS.md carries the authoring rule. file_length skips comment-only lines so
# that it counts the same lines type_body_length does.
file_length:
  warning: 1000
  ignore_comment_only_lines: true

type_body_length:
  warning: 800

identifier_name:
  min_length: 1
  allowed_symbols:
    - _

nesting:
  type_level: 2
