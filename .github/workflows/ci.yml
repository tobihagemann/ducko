name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Install tools
        # The runner image preinstalls some of these and `brew install` won't upgrade an
        # outdated preinstall; .swiftformat's rule set needs the pinned minversion.
        run: |
          brew update
          brew install swiftlint swiftformat periphery
          brew upgrade swiftlint swiftformat periphery || true

      - name: Lint & Format Check
        run: ./Scripts/lint.sh

  build-and-test:
    name: Build & Test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Build
        run: swift build

      - name: Test
        run: swift test --no-parallel
        timeout-minutes: 5
