name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Periphery's unused-code results depend on the SDK: the macOS 27 SDK declares SwiftUI's `@State`
# as a macro whose `$name` is a separate declaration. Keep these images on the Xcode used locally.
jobs:
  lint:
    name: Lint
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        # The runner image preinstalls some of these and `brew install` won't upgrade an
        # outdated preinstall; .swiftformat's rule set needs the pinned minversion.
        run: |
          brew update
          brew install swiftformat periphery
          brew upgrade swiftformat periphery || true

      - name: Install pinned SwiftLint
        # Homebrew only offers the latest SwiftLint, whose new default rules can fail lint on
        # untouched code. Install the exact version .swiftlint.yml pins, ahead of any preinstall.
        run: |
          SWIFTLINT_VERSION=$(awk '/^swiftlint_version:/ { print $2 }' .swiftlint.yml)
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -o -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/swiftlint/swiftlint" version

      - name: Lint & Format Check
        run: ./Scripts/lint.sh

  build-and-test:
    name: Build & Test
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: swift build

      - name: Test
        run: swift test --no-parallel
        timeout-minutes: 5

  build-intel:
    name: Build (x86_64 release)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Build x86_64 release
        # The runner is Apple silicon, so Build & Test only compiles arm64, while releases ship a
        # universal binary. SDK types differ per arch (e.g. SSLCipherSuite is UInt16 on arm64 but
        # UInt32 on x86_64), and release config compiles the `#if !DEBUG` branches — so build the
        # Intel slice in release config here instead of discovering failures at release time.
        run: swift build -c release --arch x86_64

  release-smoke:
    name: Release Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Run release script smoke test
        # Pure bash: PATH-shims the macOS-only signing/notarize tools and injects stub
        # sibling-scripts, then runs the real Scripts/release.sh and asserts its control
        # flow. No swift/brew setup needed; the stubs supply the absent tools.
        run: ./Scripts/tests/release_smoke_test.sh
