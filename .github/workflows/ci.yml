name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Install tools
        # The runner image preinstalls some of these and `brew install` won't upgrade an
        # outdated preinstall; .swiftformat's rule set needs the pinned minversion.
        run: |
          brew update
          brew install swiftformat periphery
          brew upgrade swiftformat periphery || true

      - name: Install pinned SwiftLint
        # Homebrew only offers the latest SwiftLint, whose new default rules can fail lint on
        # untouched code. Install the exact version .swiftlint.yml pins, ahead of any preinstall.
        run: |
          SWIFTLINT_VERSION=$(awk '/^swiftlint_version:/ { print $2 }' .swiftlint.yml)
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -o -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/swiftlint/swiftlint" version

      - name: Lint & Format Check
        run: ./Scripts/lint.sh

  build-and-test:
    name: Build & Test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Build
        run: swift build

      - name: Test
        run: swift test --no-parallel
        timeout-minutes: 5

  release-smoke:
    name: Release Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Run release script smoke test
        # Pure bash: PATH-shims the macOS-only signing/notarize tools and injects stub
        # sibling-scripts, then runs the real Scripts/release.sh and asserts its control
        # flow. No swift/brew setup needed; the stubs supply the absent tools.
        run: ./Scripts/tests/release_smoke_test.sh
